<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Author management test — in-memory only</title><body><main class="page-shell long-content"><label><input type="checkbox" data-fail>保存失敗を模擬（テスト専用）</label><div data-studio></div></main><script type="module">
import '../../src/style.css';import '../../src/viewport.css';import {mountAuthor} from '../../src/libraryStudio.js';
// Development-only fixture: it never writes the project library or calls collection endpoints.
let saved={revision:1,groups:[],glyphs:[],levels:[{id:'fixture-author-a',word:'編集テスト',morae:['く','す','り'],audio:'assets/fixture.wav',recordingId:'fixture-recording',defaultAccent:['low','high','high']}]};
const originalFetch=window.fetch.bind(window);window.fetch=async(url,options)=>{
 const path=String(url);if(path==='/__author/status')return Response.json({enabled:true});
 if(path.endsWith('content/library.json'))return Response.json(saved);
 if(path==='/__author/save'){if(document.querySelector('[data-fail]').checked)return Response.json({error:'テスト用の保存失敗'},{status:409});saved=JSON.parse(options.body);saved.revision++;return Response.json(saved);}
 if(path.includes('collection.json'))return Response.json({enabled:false});
 return originalFetch(url,options);
};await mountAuthor(document.querySelector('[data-studio]'));
</script></body></html>
