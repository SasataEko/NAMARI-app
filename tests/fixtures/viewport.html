<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive layout fixture</title><body><div id="app"></div><script type="module">
import {mountReferenceAudio} from '../../src/audioComparison.js';
import {assetUrl} from '../../src/data/projectLibrary.js';
import {mountExploration} from '../../src/exploration.js';
import {readLibrary,playableLevels} from '../../src/data/projectLibrary.js';
import {installViewportLayout} from '../../src/viewportLayout.js';
import '../../src/style.css';import '../../src/viewport.css';
const app=document.querySelector('#app');app.innerHTML='<main class="page-shell"><header class="app-header"><b>レイアウト検証</b><select aria-label="文字数"><option value="6">6文字</option><option value="7">7文字</option><option value="10">10文字</option></select><label style="font-size:10px"><input type="checkbox" aria-label="参照音声">参照</label></header><button class="title-return">一覧へ戻る</button><div data-exploration></div><nav class="bottom-nav"><button class="nav-item">図鑑</button><button class="nav-item">DIY</button><button class="nav-item">設定</button></nav></main>';installViewportLayout(app);
const library=await readLibrary(),root=app.querySelector('[data-exploration]'),select=app.querySelector('select');
const reference=app.querySelector('input');const show=()=>{const n=Number(select.value),tokens=['ふ','あ','い','う','え','お','か','き','く','け'].slice(0,n),level=playableLevels({...library,levels:[{id:'layout-fixture-'+n,word:tokens.join(''),morae:tokens,audio:null,visualExperiment:true,recordingId:'layout-fixture-'+n,defaultAccent:tokens.map(()=> 'low')}]}).find(l=>l.id==='layout-fixture-'+n);mountExploration(root,{level,profileId:'layout-fixture',studyMode:'test'});const note=root.querySelector('.visual-experiment-note'),audio=document.createElement('audio');audio.controls=true;audio.src=assetUrl(library.levels.find(l=>l.audio).audio);audio.setAttribute('aria-label','検証用の録音');note.replaceWith(audio);const text=document.createElement('p');text.className='explore-listen-copy';text.textContent='発音を聞いてみよう';audio.after(text);const phone=document.createElement('p');phone.className='explore-headphone-note';phone.textContent='※イヤホン推奨します';text.after(phone);if(reference.checked)mountReferenceAudio(audio,audio.src,()=>{});};select.onchange=show;reference.onchange=show;show();
</script></body></html>
