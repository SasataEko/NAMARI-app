<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>アンケート確認（ローカル専用）</title><style>body{font-family:sans-serif;background:#fbf9f2;padding:24px}button{padding:12px;margin:8px}</style><h1>アンケート確認</h1><p>このページは端末だけに保存します。</p><div id="tools"></div><script type="module">
import {showSurvey} from '../src/surveyUI.js';
import {surveySession,updateSurveySession} from '../src/data/surveySession.js';
if(!import.meta.env.DEV)throw Error('LOCAL_ONLY');
for(const [label,gameMode,chapter] of [['母音・子音','mode1','vowelChallenge'],['アクセント','mode1','accent'],['モーラ','mode1','mora'],['Mode1 総合','mode1',null],['Mode2 総合','mode2',null]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{showSurvey({gameMode,chapter,studyMode:'test',localPreview:true});};document.querySelector('#tools').append(b);}
const reset=document.createElement('button');reset.textContent='確認用のアンケートをリセット';reset.onclick=()=>updateSurveySession('test',s=>{s.surveys={};});document.querySelector('#tools').append(reset);
</script></html>
